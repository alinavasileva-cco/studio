name: Repair services decor part 04 prefix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-part4-prefix.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact verified prefix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          prefix=''''''
          p=Path('assets/services-decor-b64/part-04.txt')
          s=''.join(p.read_text().split())
          assert len(prefix)==4500, len(prefix)
          fixed=prefix+s[4500:]
          target='ac06601a2f17c5dc6465e9c330c0fd619d776f0365fbcf92bd29efaf914cab7c'
          assert len(fixed)==20000, len(fixed)
          assert hashlib.sha256(fixed.encode()).hexdigest()==target
          p.write_text(fixed,encoding='ascii')
          print('VERIFIED part-04 exact sha256='+target)
          PY
      - name: Commit exact part 04
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/services-decor-b64/part-04.txt
          git commit -m 'Install exact services decor part 04'
          git push
