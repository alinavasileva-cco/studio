name: Static services QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/services-static-qa.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/studio-http.log 2>&1 &
          sleep 2
      - name: Run static services checks
        run: node tools/run_services_static_qa.js
      - uses: actions/upload-artifact@v4
        with:
          name: static-services-final
          path: qa-static/
          retention-days: 2
