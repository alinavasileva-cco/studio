name: Install final services visual
on:
  push:
    paths:
      - '.github/workflows/install-services-final-20260907.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build HD transparent services visual and patch only services/cache
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          import re
          from cairosvg import svg2png
          from PIL import Image

          root = Path('.')
          svg = root / 'assets/service-combo-premium.svg'
          png = root / 'assets/service-combo-premium-hd.png'
          webp = root / 'assets/service-combo-premium-hd.webp'

          # Render the approved vector composition at true HD/large desktop size.
          svg2png(bytestring=svg.read_bytes(), write_to=str(png), output_width=3300)
          im = Image.open(png).convert('RGBA')
          alpha = im.getchannel('A')
          bbox = alpha.getbbox()
          if bbox:
              im = im.crop(bbox)
          im.save(webp, 'WEBP', quality=96, method=6)
          png.unlink(missing_ok=True)

          js_path = root / 'thecase.js'
          js = js_path.read_text(encoding='utf-8')
          js = js.replace("data-ru=\"Презентации и сайты для бизнеса\"", "data-ru=\"Презентации и сайты\"")
          js = js.replace("data-en=\"Presentations and websites for business\"", "data-en=\"Presentations and websites\"")
          js = js.replace("Презентации для бизнеса, конференций, выступлений и учёбы. Сайты — одностраничники и лендинги.", "Для бизнеса, конференций, выступлений и учёбы.")
          js = js.replace("Presentations for business, conferences, talks and study. Websites — one-page sites and landing pages.", "For business, conferences, talks and study.")
          js = re.sub(r'assets/service-combo-premium-hd\.webp\?v=[^\"\']+', 'assets/service-combo-premium-hd.webp?v=20260907-final-hd-2', js)
          js_path.write_text(js, encoding='utf-8')

          index_path = root / 'index.html'
          html = index_path.read_text(encoding='utf-8')
          html = re.sub(r'thecase\.js\?v=[^\"\']+', 'thecase.js?v=20260907-services-final-hd-2', html)
          index_path.write_text(html, encoding='utf-8')

          size = webp.stat().st_size
          if size < 100000:
              raise SystemExit(f'HD visual unexpectedly small: {size} bytes')
          print('services visual bytes:', size)
          PY
      - name: Commit final services block
        run: |
          rm -f .github/workflows/install-services-final-20260907.yml
          git config user.name 'Commercial'
          git config user.email '135322806+alinavasileva-cco@users.noreply.github.com'
          git add assets/service-combo-premium-hd.webp thecase.js index.html .github/workflows/install-services-final-20260907.yml
          git commit -m 'Finalize services block with HD transparent visual'
          git push origin HEAD:main
