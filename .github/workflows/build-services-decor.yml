            ]
          }
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          def h(s): return hashlib.sha256(s.encode('ascii')).hexdigest()
          def remove_one(text, target):
              for pos in range(len(text)):
                  c = text[:pos] + text[pos+1:]
                  if h(c) == target: return c, pos
              return None, None
          def substitute_one(text, target):
              for pos, old in enumerate(text):
                  left, right = text[:pos], text[pos+1:]
                  for ch in alphabet:
                      if ch != old:
                          c = left + ch + right
                          if h(c) == target: return c, pos, old, ch
              return None, None, None, None
          def repair_blocks(text, targets, label):
              out, bad = [], []
              for bi, target in enumerate(targets):
                  block = text[bi*500:(bi+1)*500]
                  if h(block) != target:
                      bad.append(bi)
                      fixed, pos, old, new = substitute_one(block, target)
                      if fixed is None:
                          raise SystemExit(f'{label} block {bi} cannot be repaired exactly by one substitution')
                      block = fixed
                      print(f'{label} block {bi}: {pos}: {old!r}->{new!r}')
                  out.append(block)
              print(f'{label} mismatching blocks: {bad}')
              return ''.join(out)

          parts = []
          for i, (length, target, prefix) in expected.items():
              p = root / f'part-{i:02d}.txt'
              text = ''.join(p.read_text().split())
              if h(text) != target and len(text) == length + 1:
                  fixed, pos = remove_one(text, target)
                  if fixed is not None:
                      text = fixed
                      print(f'{p}: removed transport char at {pos}')
              if h(text) != target and len(text) == length - 1 and prefix:
                  text = prefix + text
                  print(f'{p}: restored leading {prefix!r}')
              if h(text) != target and len(text) == length and i in block_targets:
                  text = repair_blocks(text, block_targets[i], f'part-{i:02d}')
              if h(text) != target and len(text) == length:
                  fixed, pos, old, new = substitute_one(text, target)
                  if fixed is not None:
                      text = fixed
                      print(f'{p}: substitution {pos}: {old!r}->{new!r}')
              if len(text) != length or h(text) != target:
                  raise SystemExit(f'{p} exact repair failed: len={len(text)} sha256={h(text)}')
              p.write_text(text, encoding='ascii')
              parts.append(text)
              print(f'VERIFIED {p}: {length} chars')

          raw = base64.b64decode(''.join(parts), validate=True)
          expected_final = '2a5c9d07fbdb6254276e5573250602986c53eb933bce4049e2344bd67dcaacd3'
          final_sha = hashlib.sha256(raw).hexdigest()
          if len(raw) != 106026 or final_sha != expected_final:
              raise SystemExit(f'final verification failed: bytes={len(raw)} sha256={final_sha}')
          Path('assets/services-decor.webp').write_bytes(raw)
          print('VERIFIED FINAL services-decor.webp: 106026 bytes sha256=' + final_sha)
          PY
          file assets/services-decor.webp
      - name: Commit verified HD decor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/services-decor-b64/part-*.txt assets/services-decor.webp
          if git diff --cached --quiet; then
            echo 'Decor already matches source.'
            exit 0
          fi
          git commit -m 'Install verified services decor [services-decor-built]'
          git push
