name: Build services decor

on:
  push:
    branches: [main]
    paths:
      - 'assets/services-decor-b64/**'
      - '.github/workflows/build-services-decor.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[services-decor-built]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          root = Path('assets/services-decor-b64')
          expected = {
              1: (20000, 'a316b5d0d22fb62851f0fad6b2488d24f8f37be63615f0a212c34fd22eb559d4', ''),
              2: (20000, '288d64e502d9e8f38d3cb5c9d09b8404e299efb296c2dcabba8c9c548f072561', 'g'),
              3: (20000, 'af3d53edd2251acd1ab700bf894d23e95484517c8481c54d6eb93de93ee21308', 'o'),
              4: (20000, 'ac06601a2f17c5dc6465e9c330c0fd619d776f0365fbcf92bd29efaf914cab7c', ''),
              5: (20000, 'a055577e8495808c023dded478ac1164fa471ced7661ac3d5ad16c3015047e4e', 'Q'),
              6: (20000, '8bcf3b6af0032127d6e7bf2971de8c8a2555c0887b4757e34878e63e36baab25', 'b'),
              7: (20000, '2378c43539d49274f3d508ea77aea65e12dd75514edb26b17fd4c08306d1d0e2', 'T'),
              8: (1368,  'db2d09a2c2d3e852581fc26cb35da1a45d6c879ae3c3e2a979609452f801466b', ''),
          }
          part3_blocks = [
            '880e36ba860f972a7d028683b1257f54953c57299817da7309fac887b0407ade','5f0b32a913f20cf7225a144bfad0400ed6f69b19cfca5fd3777e6e95b5782e21','7145476c790197b4e7847f00cc2b30383d9b93276577f8628edb6015338f4f3c','305cc07aa2cd292a8e81e07dbaf723da8708d32ea18c4645d4e38322072591df','52dddf66df416bca180880413d40e045ddb249ab1196f69d06fd1b33063aabcf','1122213ff84b1af7756f68a57c18e919d271b2c4a3704f06bad510f87b65b8a6','3aafcdc211d8cd111a56cd34cb35db28bdf29172fdb43d0f92a7a7c8b2d85d5d','5cbe4597a0e2f2116dc54a6a061fe2edb6f1d1d231beb27fe8dd36c7439fb4f2','9943acbb56beb990905825fa9202eafe9a43ec927d39d71256a0f32d291125a5','8949f7fbcb4f4b85fbe0a2b4d5b38bbdf4a6c1aa9da9f64acc7f888a0f000b78','6427458f7b4ce5354468354e97b0d38a82bd56d77193b0665b5008d9481dec7d','6ed837ea5ff762bc07479c7cc207b3932114a0d6bc20f6dd796036418e03f7d6','b8b637e67cf874a1e4a8ff59d635fefbf19a59f2a89e649f8a00794559101080','d95777db03cc34d5dd8d672133867c70cb3a9ad8eb503a663684f4829ffe4b8f','4560d74e656c97cf6a00b21077c692cb5bf1f1b0d18f644c686da83dbed03813','9e267fd8f4899d42efe00e8a4f8f2098b3312c85948cafcff2069bbc81f862dd','944905e9f69b7375c417eb5e0cbd9708382ba61539f13f9581bb3599b89a2713','049705e713a193546204795302bfc05354f83ae463437d26d70791b7cbbdff61','fbec825d15b2fea4e036e9cdf291b736b287ea498186d8962d02074d9cbc048b','669f157ef4fd2c82e03bd4c567beb938464c5d3201ea36e9553d7ccc27fe45e6','7aeb5a2f6a531ba14a6656dce613f56ef446c42adbd8f2cce39f0054e7bff0a7','9e30b0c79280af994c8cd28e29d31f68af3d543aa80e42080c14cd802d6a8afb','2949d0ebc01c23262b2dfb6ae91b916b97d37359a607ae09e33a7560e3f51591','45bea1d32754bcdd5fd20ec2856f0afcaff1d1d30f29d0f4ad6043fd13d68f29','92ea41c6eeccfe420ad7cf176565e9a6c90fe5a8aa5eaf9863f75db0ad3150dc','3184d182107ced4260dcc35e5c504ceb3cced80da3ef0a0bbe43635504ee1610','5ad12d0ae60a307b2a7a51f2d438855f0a65104f7338a16b1984ceac40cb9716','c3d868bd4cbb2d9258f77417a3ffaebe6329f9cb7a2a15572422559c4b803c2d','d036a7aa57c30c4fcd473988c7edb09ddad034c72825b07d1d4801c7b43ead50','46f880a4669917ab2a48d7fd68cf4ec96ea78daca9c0b167af0bbbfc87046f8b','ae8f6ffb4ea7061b20fa740f4027f9e831670660ce2a297a95a370d3003e3179','eb92a0b144500db8958a924d0353a75f3d6133202869478a5214b541ad15dd45','a17aec5487b20b31b18730a01b4b111032b6d77c1dd3725a3141f0a9d4ea50f0','23df026f3d59790fe78f0e398db8ff7cb5df70b746ebca985d66f7a201ad52b0','24f94f3562bdfac247ea01fd3095cb69111add66de45c75cd59e4a6e1bdb7d47','37b8ff34384e6395386a5ac38929dc3b3a20f369fe867b9cab2eb25929d59c95','ad2d8d0f21d7460a49e728d28f9e1af7e5e8a1498384fa1dfc3cacc9819fd174','f49fa047e0128fbf6db047c256685070a64d018867178b371cc8573973762195','2d74acd0b4ae71fcf76122ad0018206427ce982d5f487df3a2e4adab04030e1c','854ecaebfce47ae674595e5df7cb528f68199d046fd3840d30154dfa1103ed5a'
          ]
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          def h(s):
              return hashlib.sha256(s.encode('ascii')).hexdigest()
          def remove_one(text, target):
              for pos in range(len(text)):
                  c = text[:pos] + text[pos+1:]
                  if h(c) == target:
                      return c, pos
              return None, None
          def substitute_one(text, target):
              for pos, old in enumerate(text):
                  left, right = text[:pos], text[pos+1:]
                  for ch in alphabet:
                      if ch == old:
                          continue
                      c = left + ch + right
                      if h(c) == target:
                          return c, pos, old, ch
              return None, None, None, None
          def repair_part3_blocks(text):
              block_size = 500
              blocks = []
              bad = []
              for bi, target in enumerate(part3_blocks):
                  block = text[bi*block_size:(bi+1)*block_size]
                  if h(block) != target:
                      bad.append(bi)
                      fixed, pos, old, new = substitute_one(block, target)
                      if fixed is None:
                          raise SystemExit(f'part-03 block {bi} cannot be repaired by one substitution')
                      block = fixed
                      print(f'part-03 block {bi}: substitution {pos}: {old!r}->{new!r}')
                  blocks.append(block)
              print('part-03 mismatching blocks:', bad)
              return ''.join(blocks)

          parts = []
          for i, (length, target, prefix) in expected.items():
              p = root / f'part-{i:02d}.txt'
              text = ''.join(p.read_text().split())
              if h(text) != target:
                  if len(text) == length + 1:
                      fixed, pos = remove_one(text, target)
                      if fixed is not None:
                          text = fixed
                          print(f'repaired {p}: removed transport char at {pos}')
                  elif len(text) == length - 1 and prefix:
                      text = prefix + text
                      print(f'{p}: restored leading {prefix!r}')
                      if i == 3 and h(text) != target:
                          text = repair_part3_blocks(text)
                      elif h(text) != target:
                          fixed, pos, old, new = substitute_one(text, target)
                          if fixed is not None:
                              text = fixed
                              print(f'repaired {p}: substitution {pos}: {old!r}->{new!r}')
                  elif len(text) == length:
                      if i == 3:
                          text = repair_part3_blocks(text)
                      else:
                          fixed, pos, old, new = substitute_one(text, target)
                          if fixed is not None:
                              text = fixed
                              print(f'repaired {p}: substitution {pos}: {old!r}->{new!r}')
              if len(text) != length or h(text) != target:
                  raise SystemExit(f'{p} exact repair failed: len={len(text)} sha256={h(text)}')
              p.write_text(text, encoding='ascii')
              parts.append(text)
              print(f'VERIFIED {p}: {length} chars')

          encoded = ''.join(parts)
          raw = base64.b64decode(encoded, validate=True)
          if len(raw) != 106026:
              raise SystemExit(f'wrong WebP size: {len(raw)}')
          final_sha = hashlib.sha256(raw).hexdigest()
          expected_final = '2a5c9d07fbdb6254276e5573250602986c53eb933bce4049e2344bd67dcaacd3'
          if final_sha != expected_final:
              raise SystemExit(f'wrong WebP sha256: {final_sha}')
          Path('assets/services-decor.webp').write_bytes(raw)
          print('VERIFIED FINAL services-decor.webp: 106026 bytes sha256=' + final_sha)
          PY
          file assets/services-decor.webp
      - name: Commit verified HD decor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/services-decor-b64/part-*.txt assets/services-decor.webp
          if git diff --cached --quiet; then
            echo 'Decor already matches source.'
            exit 0
          fi
          git commit -m 'Install verified services decor [services-decor-built]'
          git push
