name: Services responsive QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/services-qa.yml'
      - 'assets/services-decor.webp'
      - 'index.html'
      - 'tools/run_services_qa.js'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/studio-http.log 2>&1 &
          sleep 2
      - name: Run services responsive checks
        run: node tools/run_services_qa.js
      - name: Commit responsive fix if produced
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix services tablet typography"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: services-qa-screenshots
          path: qa-output/
