name: Finalize static services

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-services-static.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final services refinement
        run: python3 tools/finalize_services_static.py
      - name: Commit final services
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make services static and align with hero identity"
          git push
