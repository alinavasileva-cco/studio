name: Refine services layering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-services-layering.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine services image layers only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css=".services-decor{position:absolute;z-index:4;pointer-events:none;user-select:none;width:min(560px,45vw);height:auto;left:-95px;bottom:-82px;max-width:none;filter:drop-shadow(0 25px 38px rgba(48,46,41,.08))}.services-decor-wind{z-index:2;opacity:.32;clip-path:polygon(0 0,58% 0,56% 42%,100% 67%,100% 100%,0 100%);animation:servicesHairWind 7s ease-in-out infinite;transform-origin:28% 72%;filter:saturate(1.04)}"
          new_css=".services-decor{position:absolute;pointer-events:none;user-select:none;width:min(560px,45vw);height:auto;left:-95px;bottom:-82px;max-width:none}.services-decor-base{z-index:1}.services-decor-hand{z-index:4;clip-path:polygon(43% 18%,64% 18%,66% 50%,58% 59%,54% 100%,13% 100%,30% 74%,40% 51%);filter:drop-shadow(0 18px 26px rgba(48,46,41,.08))}.services-decor-wind{z-index:2;opacity:.16;clip-path:polygon(0 0,58% 0,56% 42%,47% 54%,40% 100%,0 100%);animation:servicesHairWind 7s ease-in-out infinite;transform-origin:28% 72%;filter:saturate(1.03)}"
          if s.count(old_css)!=1:
              raise SystemExit('services desktop CSS signature not found exactly once')
          s=s.replace(old_css,new_css)
          old_mobile=".services-decor{width:320px;left:-127px;bottom:auto;top:126px;z-index:4}.services-decor-wind{z-index:2;opacity:.28;animation-duration:6.5s}"
          new_mobile=".services-decor{width:320px;left:-127px;bottom:auto;top:126px}.services-decor-base{z-index:1}.services-decor-hand{z-index:4}.services-decor-wind{z-index:2;opacity:.14;animation-duration:6.5s}"
          if s.count(old_mobile)!=1:
              raise SystemExit('services mobile CSS signature not found exactly once')
          s=s.replace(old_mobile,new_mobile)
          old_html='<img class="services-decor services-decor-base" src="assets/services-decor.webp" alt="" aria-hidden="true"><img class="services-decor services-decor-wind" src="assets/services-decor.webp" alt="" aria-hidden="true"><div class="services-panel">'
          new_html='<img class="services-decor services-decor-base" src="assets/services-decor.webp" alt="" aria-hidden="true"><img class="services-decor services-decor-wind" src="assets/services-decor.webp" alt="" aria-hidden="true"><img class="services-decor services-decor-hand" src="assets/services-decor.webp" alt="" aria-hidden="true"><div class="services-panel">'
          if s.count(old_html)!=1:
              raise SystemExit('services HTML signature not found exactly once')
          s=s.replace(old_html,new_html)
          p.write_text(s)
          print('Services layering refined; hero untouched.')
          PY
      - name: Commit services-only refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine services hair and hand layering'
          git push
