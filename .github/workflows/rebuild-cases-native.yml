name: Rebuild cases native

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-cases-native.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download case slide assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/cases/{faberge,redfox,florist,japanese,yandex,cat}
          download() {
            id="$1"; out="$2"
            curl -L --fail --retry 3 --silent --show-error "https://drive.google.com/uc?export=download&id=${id}" -o "$out"
            test "$(stat -c%s "$out")" -gt 20000
            python - "$out" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); b=p.read_bytes()[:16]
          if b[:4] != b'RIFF' or b[8:12] != b'WEBP':
              raise SystemExit(f'Not a WEBP: {p}')
          PY
          }
          download 1IGgu1qRFx-1TeHR2fuVQ9Cf_kSzLcCsk assets/cases/faberge/01.webp
          download 15zOarlo3gqSp4Bl1sQFt2gG45qdrLV9A assets/cases/faberge/02.webp
          download 1DW5TNnWwACtL7Y2jvpzJV1ylbU1abphr assets/cases/faberge/03.webp
          download 19aSZt58h59aTRnrhRn6Vm31QSfMR88Xs assets/cases/redfox/01.webp
          download 1TN1lRXM1LuvVjaDD0BiMTqWNC9eeZLcu assets/cases/redfox/02.webp
          download 14NBiuR8zeW_rBP7IoOOgGpocYwqFOaHg assets/cases/florist/01.webp
          download 1agKSGk0q9L6pL3j3ZJPyd09JRWVmy6wN assets/cases/florist/02.webp
          download 1bzY34Gs-FZcON-BflE2S0g2YMOpUUFmi assets/cases/florist/03.webp
          download 1Q6mJvDWTf53mEriXhlnUrsYArziBCikz assets/cases/florist/04.webp
          download 1gsQQPS80pxylWN9VAap4CiZVvgGbvcnu assets/cases/florist/05.webp
          download 1B8r2lBHFj6zuk8UKVbgHX_Hk8bnXJfl5 assets/cases/japanese/01.webp
          download 126y4HZl3n0I_x7kj5o8VvtOb_ed9p4gw assets/cases/japanese/02.webp
          download 1qjl-AOdwkp05cu-zFh6uN33uldYZPzza assets/cases/japanese/03.webp
          download 1ChbJ8aVs7Cq-teQ7ipsdiMHRpq5kyAf_ assets/cases/yandex/01.webp
          download 1YmEHUd39cddtY8T_mxNUMviS5ZeSDqyq assets/cases/yandex/02.webp
          download 1H44MBDgFywp32nkBMHekDjt8Maws6ekx assets/cases/yandex/03.webp
          download 1pK7wnMM0iREze4BsNNb5xPGZWsNWbM-e assets/cases/yandex/04.webp
          download 1kzfjYZEVkpZefDxLWVDvM_5h3ZfqI7ud assets/cases/cat/01.webp
          download 1KN4eR6e_Dd3Y6nkBv_SwKtyl7FiRXbsW assets/cases/cat/02.webp

      - name: Replace Google embeds with native editorial carousels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def card(cls, slug, title, ru, en, count):
              imgs=[]
              for i in range(1,count+1):
                  active=' is-active' if i==1 else ''
                  loading='eager' if slug=='faberge' and i==1 else 'lazy'
                  imgs.append(f'<img class="case-slide{active}" src="assets/cases/{slug}/{i:02d}.webp" alt="{title} — slide {i}" loading="{loading}" decoding="async"/>')
              return f'''<article class="case-card {cls}">
          <div class="case-carousel" data-carousel aria-label="{title}">
          <div class="case-slides">{''.join(imgs)}</div>
          <div class="case-controls">
          <div class="case-arrows">
          <button class="case-arrow case-prev" type="button" aria-label="Previous slide">←</button>
          <button class="case-arrow case-next" type="button" aria-label="Next slide">→</button>
          </div>
          <span class="case-counter"><b>1</b> / {count}</span>
          </div>
          </div>
          <div class="case-meta"><div><h3>{title}</h3><p data-en="{en}" data-ru="{ru}">{ru}</p></div></div>
          </article>'''

          cases = '\n'.join([
              card('case-large','faberge','FABERGÉ','Культурная презентация','Cultural presentation',3),
              card('case-medium','redfox','RED FOX','Продуктовая презентация','Product presentation',2),
              card('case-medium','florist','ЕЛЕНА ЦВЕТОЧНАЯ','Бренд-презентация','Brand presentation',5),
              card('case-medium','japanese','JAPANESE MINIMALISM','Editorial-презентация','Editorial presentation',3),
              card('case-large','yandex','YANDEX TAXI','Recruitment-презентация','Recruitment presentation',4),
              card('case-medium','cat','CAT GROOMER','Сервисная презентация','Service presentation',2),
          ])
          new = '<div class="cases-grid">\n' + cases + '\n</div>\n</div>\n</section>\n</main>\n<section class="contact"'
          pattern = re.compile(r'<div class="cases-grid">.*?</div>\s*</div>\s*</section>\s*</main>\s*<section class="contact"', re.S)
          s2, n = pattern.subn(new, s, count=1)
          if n != 1:
              raise SystemExit(f'Could not replace cases grid, matches={n}')
          s2 = s2.replace('thecase-v3.css?v=20260904-1','thecase-v3.css?v=20260904-2')
          s2 = s2.replace('thecase.js?v=20260904-1','thecase.js?v=20260904-2')
          p.write_text(s2, encoding='utf-8')

          css = Path('thecase-v3.css')
          c = css.read_text(encoding='utf-8')
          marker='/* THE CASE native presentation carousels v4 */'
          if marker not in c:
              c += r'''

/* THE CASE native presentation carousels v4 */
.work{background:linear-gradient(180deg,#f4f7f9 0%,#eef3f6 100%)}
.work .shell{position:relative}
.work-head{align-items:flex-end;margin-bottom:42px}
.cases-grid{display:grid!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;gap:54px 28px!important;align-items:start!important;overflow:visible!important}
.case-card{min-width:0!important;max-width:100%!important;background:transparent!important;border:0!important;border-radius:0!important;overflow:visible!important;box-shadow:none!important}
.case-card.case-large{grid-column:span 7!important}
.case-card.case-medium{grid-column:span 5!important}
.case-carousel{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:24px;background:#0c1114;border:1px solid rgba(18,23,27,.11);box-shadow:0 24px 52px rgba(24,34,40,.11);touch-action:pan-y;isolation:isolate}
.case-slides{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.case-slide{position:absolute;inset:0;width:100%;height:100%;max-width:none!important;object-fit:cover;display:none!important}
.case-slide.is-active{display:block!important}
.case-controls{position:absolute;z-index:3;left:14px;right:14px;bottom:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.case-arrows{display:flex;gap:7px;pointer-events:auto}
.case-arrow{display:grid;place-items:center;width:40px;height:40px;border:1px solid rgba(255,255,255,.46);border-radius:999px;background:rgba(13,18,22,.56);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font:400 18px/1 var(--m);cursor:pointer;transition:background .15s ease,border-color .15s ease}
.case-arrow:hover{background:rgba(216,92,43,.92);border-color:rgba(216,92,43,.95)}
.case-counter{pointer-events:none;min-width:62px;padding:9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.42);background:rgba(251,253,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);font:500 11px/1 var(--m);letter-spacing:.06em;text-align:center;box-shadow:0 7px 20px rgba(0,0,0,.08)}
.case-counter b{font-weight:600;color:var(--orange)}
.case-meta{display:block!important;padding:16px 2px 0!important;border:0!important;min-height:0!important}
.case-meta h3{margin:0 0 5px!important;font-family:var(--u)!important;font-size:clamp(15px,1.45vw,21px)!important;font-weight:300!important;letter-spacing:-.035em!important;color:var(--ink)!important}
.case-meta p{margin:0!important;font-size:12px!important;line-height:1.35!important;color:#68757d!important}
.case-card:nth-child(3),.case-card:nth-child(4){margin-top:24px}
.case-card:nth-child(5){grid-column:span 7!important}
.case-card:nth-child(6){grid-column:span 5!important}
.case-viewport{display:none!important}
@media(max-width:980px){
  .cases-grid{gap:38px 22px!important}
  .case-card.case-large,.case-card.case-medium,.case-card:nth-child(5),.case-card:nth-child(6){grid-column:span 6!important}
  .case-card:nth-child(3),.case-card:nth-child(4){margin-top:0}
  .case-carousel{border-radius:20px}
}
@media(max-width:640px){
  .work{padding-top:58px!important;padding-bottom:74px!important}
  .work-head{display:flex!important;align-items:flex-end!important;gap:16px!important;margin-bottom:26px!important}
  .work-head h2{max-width:75vw!important;font-size:30px!important;line-height:.98!important}
  .portfolio-link{font-size:9px!important;white-space:nowrap!important;margin-bottom:2px!important}
  .cases-grid{display:block!important;width:100%!important;max-width:100%!important}
  .case-card,.case-card.case-large,.case-card.case-medium,.case-card:nth-child(5),.case-card:nth-child(6){display:block!important;width:100%!important;max-width:100%!important;margin:0 0 36px!important;grid-column:auto!important}
  .case-carousel{width:100%!important;max-width:100%!important;aspect-ratio:16/9!important;border-radius:18px!important;box-shadow:0 15px 34px rgba(24,34,40,.10)!important}
  .case-controls{left:10px;right:10px;bottom:10px}
  .case-arrow{width:36px;height:36px;font-size:16px;background:rgba(13,18,22,.63)}
  .case-counter{min-width:56px;padding:8px 10px;font-size:10px}
  .case-meta{padding:12px 2px 0!important}
  .case-meta h3{font-size:17px!important;line-height:1.08!important;margin-bottom:4px!important}
  .case-meta p{font-size:11px!important}
}
@media(max-width:390px){
  .work-head h2{font-size:27px!important;max-width:72vw!important}
  .case-card,.case-card.case-large,.case-card.case-medium{margin-bottom:32px!important}
  .case-carousel{border-radius:16px!important}
}
'''
              css.write_text(c, encoding='utf-8')

          js = Path('thecase.js')
          j = js.read_text(encoding='utf-8')
          jmarker='// THE CASE native carousel v4'
          if jmarker not in j:
              j += r'''

// THE CASE native carousel v4
(() => {
  document.querySelectorAll('[data-carousel]').forEach(carousel => {
    const slides = [...carousel.querySelectorAll('.case-slide')];
    const prev = carousel.querySelector('.case-prev');
    const next = carousel.querySelector('.case-next');
    const current = carousel.querySelector('.case-counter b');
    let index = 0;
    const show = value => {
      index = (value + slides.length) % slides.length;
      slides.forEach((slide, i) => slide.classList.toggle('is-active', i === index));
      if (current) current.textContent = String(index + 1);
    };
    prev?.addEventListener('click', () => show(index - 1));
    next?.addEventListener('click', () => show(index + 1));
    let startX = 0, startY = 0;
    carousel.addEventListener('touchstart', e => {
      const t = e.changedTouches[0]; startX = t.clientX; startY = t.clientY;
    }, {passive:true});
    carousel.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      const dx = t.clientX - startX, dy = t.clientY - startY;
      if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.25) show(index + (dx < 0 ? 1 : -1));
    }, {passive:true});
    show(0);
  });
})();
'''
              js.write_text(j, encoding='utf-8')
          PY

      - name: Structural QA
        run: |
          set -euo pipefail
          ! grep -q 'docs.google.com/presentation.*embed' index.html
          test "$(grep -o 'class="case-slide' index.html | wc -l)" -eq 19
          test "$(grep -o 'data-carousel' index.html | wc -l)" -eq 6
          test "$(find assets/cases -name '*.webp' | wc -l)" -eq 19
          grep -q 'THE CASE native presentation carousels v4' thecase-v3.css
          grep -q 'THE CASE native carousel v4' thecase.js

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html thecase-v3.css thecase.js assets/cases
          git diff --cached --quiet && exit 0
          git commit -m "Replace Google Slides embeds with native case carousels"
          git push origin HEAD:main
