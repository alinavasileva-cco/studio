name: Install vivid static services artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-vivid-static-services.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify vivid static artwork
        shell: bash
        run: |
          set -euo pipefail
          cat assets/vivid-b64/part-01.txt assets/vivid-b64/part-02.txt assets/vivid-b64/part-03.txt assets/vivid-b64/part-04.txt assets/vivid-b64/part-05.txt | tr -d '\r\n\t ' > /tmp/services-vivid.b64
          test "$(wc -c < /tmp/services-vivid.b64)" = "97256"
          base64 -d /tmp/services-vivid.b64 > assets/services-decor-vivid.webp
          test "$(stat -c%s assets/services-decor-vivid.webp)" = "72940"
          echo "3cdca974ba9e86b61c99bb99dcbc806b512e727cc337a3a6c8e765fae631f8e4  assets/services-decor-vivid.webp" | sha256sum -c -
          file assets/services-decor-vivid.webp
      - name: Point Services only to the vivid static asset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          old = 'src="assets/services-decor.webp" alt="" aria-hidden="true"'
          new = 'src="assets/services-decor-vivid.webp" alt="" aria-hidden="true"'
          if s.count(old) != 1:
              raise SystemExit(f'expected one Services decor src, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)

          q = Path('tools/run_services_qa.js')
          t = q.read_text()
          oldq = "const assetOk = data.decorSrc === 'assets/services-decor.webp' && data.decorNaturalWidth >= 300 && data.decorNaturalHeight >= 900;"
          newq = "const assetOk = data.decorSrc === 'assets/services-decor-vivid.webp' && data.decorNaturalWidth >= 260 && data.decorNaturalHeight >= 830;"
          if t.count(oldq) != 1:
              raise SystemExit(f'expected one QA asset signature, found {t.count(oldq)}')
          q.write_text(t.replace(oldq, newq))
          PY
      - name: Commit final static Services asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/services-decor-vivid.webp index.html tools/run_services_qa.js
          git rm -r assets/vivid-b64
          git rm .github/workflows/install-vivid-static-services.yml
          git commit -m "Install sharp vivid static Services artwork"
          git push
