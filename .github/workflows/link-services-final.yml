name: Link services final stylesheet
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/link-services-final.yml
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link stylesheet
        run: python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); tag='<link rel=\"stylesheet\" href=\"services-final.css?v=20260903b\">'; s=s if tag in s else s.replace('</head>',tag+'</head>',1); p.write_text(s,encoding='utf-8')"
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use final static services styling"
          git push
