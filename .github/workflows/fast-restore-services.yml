name: Fast restore services visual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-restore-services.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore working services visual and keep hair animation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/services-hair-hand.webp', 'assets/services-decor.webp')
          p.write_text(s, encoding='utf-8')

          p = Path('services-final.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace("assets/services-hair-hand.webp", "assets/services-decor.webp")
          p.write_text(s, encoding='utf-8')

          p = Path('tools/run_services_qa.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("data.decorSrc === 'assets/services-hair-hand.webp' && data.decorNaturalWidth === 240 && data.decorNaturalHeight === 744", "data.decorSrc === 'assets/services-decor.webp' && data.decorNaturalWidth > 0 && data.decorNaturalHeight > 0")
          s = s.replace("/services-hair-hand\\.webp/", "/services-decor\\.webp/")
          p.write_text(s, encoding='utf-8')
          PY

          rm -f assets/services-hair-hand.webp assets/services-hair-hand-fixed.webp

      - name: Commit fast restore
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services-final.css tools/run_services_qa.js
          git add -u assets || true
          git rm .github/workflows/fast-restore-services.yml
          git commit -m "Restore working services visual and animated hair"
          git push
