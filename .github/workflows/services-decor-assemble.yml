name: Build sharp static Services artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/services-decor-assemble.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified transparent source
        shell: bash
        run: |
          set -euo pipefail
          head -c 20000 assets/services-decor-b64/part-01.txt | tr -d '\r\n\t ' > /tmp/p01
          { printf 'g'; cat assets/services-decor-b64/part-02.txt; } | tr -d '\r\n\t ' > /tmp/p02
          { printf 'o'; cat assets/services-decor-b64/part-03.txt; } | tr -d '\r\n\t ' > /tmp/p03
          cat assets/services-decor-b64/part-04.txt | tr -d '\r\n\t ' > /tmp/p04
          { printf 'Q'; cat assets/services-decor-b64/part-05.txt; } | tr -d '\r\n\t ' > /tmp/p05
          { printf 'b'; cat assets/services-decor-b64/part-06.txt; } | tr -d '\r\n\t ' > /tmp/p06
          { printf 'T'; cat assets/services-decor-b64/part-07.txt; } | tr -d '\r\n\t ' > /tmp/p07
          cat assets/services-decor-b64/part-08.txt | tr -d '\r\n\t ' > /tmp/p08
          cat /tmp/p0{1,2,3,4,5,6,7,8} > /tmp/services-decor.b64
          test "$(wc -c < /tmp/services-decor.b64)" = "141368"
          base64 -d /tmp/services-decor.b64 > /tmp/services-decor-source.webp
          test "$(stat -c%s /tmp/services-decor-source.webp)" = "106026"
          echo "2a5c9d07fbdb6254276e5573250602986c53eb933bce4049e2344bd67dcaacd3  /tmp/services-decor-source.webp" | sha256sum -c -
      - name: Create high-density sharp production asset
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1 || ! command -v cwebp >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick webp
          fi
          identify /tmp/services-decor-source.webp
          convert /tmp/services-decor-source.webp \
            -colorspace sRGB \
            -filter Lanczos -resize 200% \
            -modulate 102,116,100 \
            -unsharp 0x0.85+0.75+0.015 \
            /tmp/services-decor-sharp.png
          cwebp -quiet -q 96 -alpha_q 100 -m 6 -metadata none /tmp/services-decor-sharp.png -o assets/services-decor-sharp.webp
          identify assets/services-decor-sharp.webp
          test "$(stat -c%s assets/services-decor-sharp.webp)" -gt 90000
      - name: Switch Services to sharp static art and clean staging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='src="assets/services-decor-vivid.webp"'
          new='src="assets/services-decor-sharp.webp"'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one Services decor src, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('tools/run_services_qa.js')
          s=p.read_text(encoding='utf-8')
          old="data.decorSrc === 'assets/services-decor-vivid.webp'"
          new="data.decorSrc === 'assets/services-decor-sharp.webp'"
          if old not in s:
              raise SystemExit('QA asset marker missing')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('.github/workflows/services-qa.yml')
          s=p.read_text(encoding='utf-8')
          marker="      - 'assets/services-decor-vivid.webp'\n"
          sharp="      - 'assets/services-decor-sharp.webp'\n"
          if sharp not in s:
              s=s.replace(marker, marker+sharp)
          p.write_text(s,encoding='utf-8')
          PY
          rm -rf assets/services-decor-b64 assets/services-avif-b64 assets/services-sharp-b64
          rm -f assets/services-decor-1.b64 assets/services-decor.webp
          rm -f assets/services-decor-desktop.svg assets/services-decor-mobile.svg
          rm -f .github/workflows/install-services-avif.yml
          rm -f .github/workflows/services-decor-assemble.yml
      - name: Commit production artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install sharp static Services artwork"
          git push
