name: Build The Case Instagram DM APK

on:
  push:
    branches:
      - instagram-dm-app
    paths:
      - "android-dm-app/**"
      - ".github/workflows/build-instagram-dm-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-dm-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android-dm-app/app/build/outputs/apk/debug/app-debug.apk TheCase-Instagram-DM-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheCase-Instagram-DM-debug
          path: TheCase-Instagram-DM-debug.apk
          if-no-files-found: error
          retention-days: 30
